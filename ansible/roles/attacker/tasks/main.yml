- name: "Attacker tooling packages (maintenance mode only: no Internet otherwise)"
  ansible.builtin.apt:
    name: "{{ attacker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  # A cold clone's first apt update is ~28 MB through the maintenance allowlist and can fail on a rotating CDN address.
  register: attacker_apt
  until: attacker_apt is succeeded
  retries: 4
  delay: 20

- name: Lab details for the exercise scripts (rendered from network/plan.json)
  ansible.builtin.file: { path: /etc/opaleye, state: directory, mode: "0755" }

- name: Lab details file
  ansible.builtin.template:
    src: lab.json.j2
    dest: /etc/opaleye/lab.json
    mode: "0644"

- name: Exercise working directory (cleared by labops.py attacker-clean, never by a target reset)
  ansible.builtin.file:
    path: "{{ exercise_dir }}"
    state: directory
    owner: "{{ attacker_user }}"
    mode: "0750"

- name: Exercise 1 script
  ansible.builtin.copy:
    src: exercise1
    dest: /usr/local/bin/exercise1
    mode: "0755"

# #51: lightweight desktop reached only through the Guacamole gateway (firewall: gateway to attacker:3389 only).
- name: Desktop packages (maintenance mode only)
  ansible.builtin.apt:
    name: "{{ desktop_packages }}"
    state: present
    install_recommends: false
  register: attacker_desktop_apt
  until: attacker_desktop_apt is succeeded
  retries: 4
  delay: 20

- name: XFCE session for RDP logins
  ansible.builtin.copy:
    dest: "/home/{{ attacker_user }}/.xsession"
    content: "startxfce4\n"
    owner: "{{ attacker_user }}"
    mode: "0755"

- name: xrdp can read its TLS key
  ansible.builtin.user:
    name: xrdp
    groups: ssl-cert
    append: true

- name: RDP login password for the attacker user
  ansible.builtin.user:
    name: "{{ attacker_user }}"
    password: "{{ attacker_rdp_password | password_hash('sha512') }}"
  when: attacker_rdp_password | length > 0
  no_log: true

- name: xrdp enabled
  ansible.builtin.systemd:
    name: xrdp
    enabled: true
    state: started
