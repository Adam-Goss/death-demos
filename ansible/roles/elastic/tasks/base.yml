- name: Data and snapshot filesystems
  community.general.filesystem:
    fstype: ext4
    dev: "{{ item.dev }}"
    opts: "-L {{ item.label }}"
  loop:
    - { dev: /dev/vdb, label: es-data }
    - { dev: /dev/vdc, label: es-snapshots }

# No mode or owner here: the elasticsearch role sets them on the mounted filesystem, and setting a different
# mode on the (un)mounted directory would flip every run.
- name: Mount points
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop: [/var/lib/elasticsearch, /srv/es-snapshots]

- name: Mount data and snapshot disks
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "LABEL={{ item.label }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted
  loop:
    - { path: /var/lib/elasticsearch, label: es-data }
    - { path: /srv/es-snapshots, label: es-snapshots }

# Lab NTP is on the firewall VM (.1 of this zone). Elastic has no other route out.
- name: Lab NTP drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    mode: "0755"

- name: Lab NTP
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/lab.conf
    content: "[Time]\nNTP={{ el_gw }}\n"
    mode: "0644"
  notify: Restart timesyncd

- name: Lab CA directory
  ansible.builtin.file:
    path: /etc/lab-ca
    state: directory
    mode: "0755"

- name: Lab CA certificate and server certificate
  ansible.builtin.copy:
    src: "{{ secrets_dir }}/ca/{{ item.src }}"
    dest: "/etc/lab-ca/{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: ca.crt, dest: ca.crt, mode: "0644" }
    - { src: server-chain.crt, dest: server.crt, mode: "0644" }
    - { src: server.key, dest: server.key, mode: "0640" }
  notify: [Restart elasticsearch, Restart kibana]
