# Every API call runs from the controller over TLS verified with the lab CA.
- name: ILM policies (90 days evidence, 14 days metrics; a minimum, the disk watermark is the real limit)
  ansible.builtin.uri:
    url: "{{ api_ctl }}/_ilm/policy/{{ el.retention[item].policy }}"
    method: PUT
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ secrets_dir }}/ca/ca.crt"
    body_format: json
    body:
      policy:
        phases:
          hot:
            actions:
              rollover: { max_age: 30d, max_primary_shard_size: 50gb }
          delete:
            min_age: "{{ el.retention[item].days }}d"
            actions: { delete: {} }
  loop: [evidence, metrics]
  delegate_to: localhost
  become: false
  no_log: true

# M4 (issue #23): the final pipeline that stamps lab.target_id / lab.rebuild_generation must exist before any
# stream names it, or indexing into that stream fails. Created only when absent: its agent registry is appended
# to by scripts/fleetctl.py register-agent and a re-run of this play must never wipe it.
- name: Lab stamp pipeline present?
  ansible.builtin.uri:
    url: "{{ api_ctl }}/_ingest/pipeline/{{ plan.target_stack.stamp_pipeline }}"
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ secrets_dir }}/ca/ca.crt"
    status_code: [200, 404]
  register: stamp
  delegate_to: localhost
  become: false
  no_log: true

- name: Lab stamp pipeline (create only)
  ansible.builtin.uri:
    url: "{{ api_ctl }}/_ingest/pipeline/{{ plan.target_stack.stamp_pipeline }}"
    method: PUT
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ secrets_dir }}/ca/ca.crt"
    body_format: json
    body: "{{ lookup('ansible.builtin.file', 'lab-stamp-pipeline.json') | from_json }}"
  when: stamp.status == 404
  delegate_to: localhost
  become: false
  no_log: true

# Fleet 9 supplies its own final pipeline. Its supported global custom hook must stamp
# integration events; the component final pipeline remains useful for non-Fleet flows.
- name: Lab stamp through the Fleet custom ingest hook
  ansible.builtin.uri:
    url: "{{ api_ctl }}/_ingest/pipeline/global@custom"
    method: PUT
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ secrets_dir }}/ca/ca.crt"
    body_format: json
    body:
      description: "Opaleye lab fields through Fleet's supported global hook"
      _meta: { managed_by: opaleye }
      processors:
        - pipeline: { name: "{{ plan.target_stack.stamp_pipeline }}" }
        - script:
            description: "Discard Docker metadata guessed from an Apache log filename"
            if: "ctx.data_stream != null && ctx.data_stream.dataset != null && ctx.data_stream.dataset.startsWith('apache.') && ctx.container != null && ctx.container.id != null && ctx.container.id.length() != 64"
            source: "ctx.remove('container');"
  delegate_to: localhost
  become: false
  no_log: true

# Fleet integration templates include <data stream>@custom, so this sets the policy per data stream.
# No replicas: single node. Datasets confirmed against real data at A4; extend plan.json then.
- name: Per-data-stream lifecycle (@custom component templates)
  ansible.builtin.uri:
    url: "{{ api_ctl }}/_component_template/{{ item.name }}@custom"
    method: PUT
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ secrets_dir }}/ca/ca.crt"
    body_format: json
    body:
      template:
        settings:
          index.lifecycle.name: "{{ el.retention[item.class].policy }}"
          index.number_of_replicas: 0
          index.final_pipeline: "{{ plan.target_stack.stamp_pipeline }}"
        mappings:
          properties:
            lab:
              properties:
                target_id: { type: keyword }
                rebuild_generation: { type: long }
                exercise_id: { type: keyword }
      _meta: { managed_by: opaleye, retention_class: "{{ item.class }}" }
  loop: >-
    {{ (el.datasets.evidence | map('community.general.dict_kv', 'name') | map('combine', {'class': 'evidence'}) | list)
       + (el.datasets.metrics | map('community.general.dict_kv', 'name') | map('combine', {'class': 'metrics'}) | list) }}
  loop_control: { label: "{{ item.name }}" }
  delegate_to: localhost
  become: false
  no_log: true

# A data stream created before its @custom template existed keeps the default policy and replicas until it
# rolls over. Re-apply no replicas to every backing index and roll over any lab stream not yet on its lab policy.
- name: Existing lab data streams adopt the lab policy
  ansible.builtin.shell: |
    set -eo pipefail
    api={{ api_ctl }}
    # The password goes to curl on stdin (-K -), never on its command line.
    c() { printf 'user = "elastic:%s"\n' "$PW" | curl -sS -f --cacert {{ secrets_dir }}/ca/ca.crt -K - "$@"; }
    c -X PUT -H 'Content-Type: application/json' -d '{"index.number_of_replicas":0}' \
      "$api/{{ item.name }}-*/_settings?expand_wildcards=all&ignore_unavailable=true&allow_no_indices=true" >/dev/null
    c "$api/_data_stream/{{ item.name }}-*?expand_wildcards=all" | python3 -c '
    import json,sys
    for s in json.load(sys.stdin).get("data_streams",[]):
        if s.get("ilm_policy")!="{{ el.retention[item.class].policy }}": print(s["name"])
    ' | while read ds; do
      c -X POST "$api/$ds/_rollover" >/dev/null && echo "changed $ds"
    done
  args:
    executable: /bin/bash
  environment:
    PW: "{{ elastic_password }}"
  register: adopt
  changed_when: "'changed' in adopt.stdout"
  loop: >-
    {{ (el.datasets.evidence | map('community.general.dict_kv', 'name') | map('combine', {'class': 'evidence'}) | list)
       + (el.datasets.metrics | map('community.general.dict_kv', 'name') | map('combine', {'class': 'metrics'}) | list) }}
  loop_control: { label: "{{ item.name }}" }
  delegate_to: localhost
  become: false
  no_log: true

# Endpoint's internal action/diagnostic streams are vendor-managed (not hunt
# evidence), but their default replica cannot be allocated on this single node.
- name: Internal Endpoint stream replica templates
  ansible.builtin.uri:
    url: "{{ api_ctl }}/_component_template/{{ item }}@custom"
    method: PUT
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ secrets_dir }}/ca/ca.crt"
    body_format: json
    body:
      template:
        settings: { index.number_of_replicas: 0 }
      _meta: { managed_by: opaleye }
  loop: "{{ el.endpoint_internal_datasets }}"
  delegate_to: localhost
  become: false
  no_log: true

- name: Existing internal Endpoint stream replicas
  ansible.builtin.uri:
    url: "{{ api_ctl }}/{{ item }}-*/_settings?expand_wildcards=all&ignore_unavailable=true&allow_no_indices=true"
    method: PUT
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ secrets_dir }}/ca/ca.crt"
    body_format: json
    body: { index.number_of_replicas: 0 }
    status_code: [200, 404]
  changed_when: false
  loop: "{{ el.endpoint_internal_datasets }}"
  delegate_to: localhost
  become: false
  no_log: true

- name: Snapshot repository
  ansible.builtin.uri:
    url: "{{ api_ctl }}/_snapshot/{{ el.snapshots.repository }}"
    method: PUT
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ secrets_dir }}/ca/ca.crt"
    body_format: json
    body: { type: fs, settings: { location: /srv/es-snapshots/lab } }
  delegate_to: localhost
  become: false
  no_log: true

- name: Daily snapshot policy (14 days retained)
  ansible.builtin.uri:
    url: "{{ api_ctl }}/_slm/policy/{{ el.snapshots.policy }}"
    method: PUT
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: true
    ca_path: "{{ secrets_dir }}/ca/ca.crt"
    body_format: json
    body:
      schedule: "{{ el.snapshots.schedule }}"
      name: "<lab-daily-{now/d}>"
      repository: "{{ el.snapshots.repository }}"
      config: { indices: ["*"], include_global_state: true, expand_wildcards: all }
      retention:
        expire_after: "{{ el.snapshots.retain_days }}d"
        min_count: 3
        max_count: 30
  delegate_to: localhost
  become: false
  no_log: true
