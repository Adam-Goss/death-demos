# #51: the Guacamole gateway VM. Re-runnable. Package installs and image pulls need maintenance mode
# (scripts/labmode.py maintenance --minutes 30 --reason "gateway packages"): the gateway has no Internet otherwise.
- name: Hostname
  ansible.builtin.hostname:
    name: opaleye-gateway

- name: Update sources reachable (needs maintenance mode)
  ansible.builtin.wait_for:
    host: deb.debian.org
    port: 443
    timeout: 15

- name: Docker and tools
  ansible.builtin.apt:
    name: [docker.io, docker-compose, curl, ca-certificates, openssl, openssh-client]
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: gateway_apt
  until: gateway_apt is succeeded
  retries: 4
  delay: 20

- name: Docker enabled
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# Lab NTP is on the firewall VM (.1 of this zone).
- name: Timesyncd drop-in directory
  ansible.builtin.file: { path: /etc/systemd/timesyncd.conf.d, state: directory, mode: "0755" }

- name: Lab NTP
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/lab.conf
    content: "[Time]\nNTP={{ gw_fw }}\n"
    mode: "0644"
  register: ntp

- name: Restart timesyncd
  ansible.builtin.systemd: { name: systemd-timesyncd, state: restarted }
  when: ntp.changed

- name: Guacamole directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop: ["{{ guac_dir }}", "{{ guac_dir }}/tls", "{{ guac_dir }}/ssh"]

# Secrets are generated here once and stay on the VM (and, for the targets' key, the gitignored secrets/ dir).
- name: Database password (generated once)
  ansible.builtin.shell: |
    umask 077
    pw=$(openssl rand -hex 24)
    printf 'POSTGRES_PASSWORD=%s\nPOSTGRESQL_PASSWORD=%s\n' "$pw" "$pw" > {{ guac_dir }}/.env
  args:
    creates: "{{ guac_dir }}/.env"
  no_log: true

- name: TLS certificate for the gateway address (self-signed; the VPN is the trust boundary)
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey rsa:3072 -nodes -days 825 -subj /CN=opaleye-gateway
      -addext subjectAltName=IP:{{ gw_ip }},DNS:opaleye-gateway
      -keyout {{ guac_dir }}/tls/gateway.key -out {{ guac_dir }}/tls/gateway.crt
    creates: "{{ guac_dir }}/tls/gateway.crt"

- name: SSH key Guacamole uses to reach the targets
  ansible.builtin.command:
    cmd: ssh-keygen -q -t ed25519 -N "" -C opaleye-gateway -f {{ guac_dir }}/ssh/targets_ed25519
    creates: "{{ guac_dir }}/ssh/targets_ed25519"

- name: Controller secrets directory
  ansible.builtin.file:
    path: "{{ secrets_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Fetch the targets' key pair (guacctl.py loads it into the SSH connections; the target role authorises the public half)
  ansible.builtin.fetch:
    src: "{{ guac_dir }}/ssh/{{ item }}"
    dest: "{{ secrets_dir }}/{{ item }}"
    flat: true
  loop: [targets_ed25519, targets_ed25519.pub]

- name: Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ guac_dir }}/compose.yml"
    mode: "0644"

- name: Proxy config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ guac_dir }}/nginx.conf"
    mode: "0644"
  register: proxy

- name: Database schema (generated by the pinned Guacamole image)
  ansible.builtin.shell: >-
    docker run --rm {{ images.guacamole.ref }}@{{ images.guacamole.digest }}
    /opt/guacamole/bin/initdb.sh --postgresql > {{ guac_dir }}/initdb.sql
  args:
    creates: "{{ guac_dir }}/initdb.sql"

- name: Start the database first
  ansible.builtin.command: docker-compose -f {{ guac_dir }}/compose.yml up -d postgres
  changed_when: false

- name: Wait for the database
  ansible.builtin.command: docker-compose -f {{ guac_dir }}/compose.yml exec -T postgres pg_isready -U guacamole
  register: pg
  until: pg.rc == 0
  retries: 20
  delay: 3
  changed_when: false

# Loaded once. The schema creates the default guacadmin account; scripts/guacctl.py bootstrap replaces its password.
- name: Load the schema once
  ansible.builtin.shell: >-
    docker-compose -f {{ guac_dir }}/compose.yml exec -T postgres psql -U guacamole -d guacamole -v ON_ERROR_STOP=1
    < {{ guac_dir }}/initdb.sql && touch {{ guac_dir }}/.schema-loaded
  args:
    creates: "{{ guac_dir }}/.schema-loaded"

- name: Start Guacamole
  ansible.builtin.command: docker-compose -f {{ guac_dir }}/compose.yml up -d
  register: up
  changed_when: "'Created' in up.stderr or 'Recreated' in up.stderr or 'Started' in up.stderr"

- name: Restart the proxy when its config changed
  ansible.builtin.command: docker-compose -f {{ guac_dir }}/compose.yml restart proxy
  when: proxy.changed and not up.changed

- name: Wait for the web app through the proxy
  ansible.builtin.uri:
    url: https://127.0.0.1:{{ gw.web_port }}/api/languages
    validate_certs: false
  register: web
  until: web.status == 200
  retries: 30
  delay: 5
