# The enrolment token exists only in this play's memory: issued by Fleet, passed to `elastic-agent install`,
# never written to a file, template, image or log (no_log on every task that holds it).
- name: Is the Agent installed?
  ansible.builtin.stat:
    path: /opt/Elastic/Agent/elastic-agent
  register: agent

- name: Package cache (controller)
  ansible.builtin.file:
    path: "{{ cache_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

# The target cannot reach artifacts.elastic.co: download on the workstation, check the pinned sha512, copy.
- name: Download the Agent (controller, checksum enforced)
  ansible.builtin.get_url:
    url: "{{ agent_pkg.url }}"
    dest: "{{ cache_dir }}/{{ agent_pkg.file }}"
    checksum: "sha512:{{ agent_pkg.sha512 }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: not agent.stat.exists

- name: Unpack the Agent
  ansible.builtin.unarchive:
    src: "{{ cache_dir }}/{{ agent_pkg.file }}"
    dest: /var/tmp
    creates: "/var/tmp/elastic-agent-{{ el.version }}-linux-x86_64/elastic-agent"
  when: not agent.stat.exists

# Retires the previous token and agent record for this target, then issues a fresh token.
- name: Enrolment token
  ansible.builtin.command:
    argv: [python3, "{{ fleetctl }}", issue-token, "{{ target }}", "{{ rebuild_generation }}"]
  register: token
  changed_when: true
  no_log: true
  delegate_to: localhost
  become: false
  when: not agent.stat.exists

- name: Install and enrol the Agent
  ansible.builtin.command:
    argv:
      - "/var/tmp/elastic-agent-{{ el.version }}-linux-x86_64/elastic-agent"
      - install
      - --non-interactive
      - --url=https://{{ el_ip }}:8220
      - --enrollment-token={{ token.stdout | trim }}
      - --certificate-authorities=/etc/lab-ca/ca.crt
  no_log: true
  when: not agent.stat.exists

- name: Agent staging removed
  ansible.builtin.file:
    path: "/var/tmp/elastic-agent-{{ el.version }}-linux-x86_64"
    state: absent

# Maps agent.id -> lab.target_id / lab.rebuild_generation in the lab-stamp pipeline (needs scripts/elastic-tunnel.sh).
- name: Register the agent for lab fields
  ansible.builtin.command:
    argv: [python3, "{{ fleetctl }}", register-agent, "{{ target }}", "{{ rebuild_generation }}"]
  changed_when: true
  delegate_to: localhost
  become: false
