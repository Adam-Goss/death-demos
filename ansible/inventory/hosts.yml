# Guests only; no Proxmox node. Reached over the VPN with the key given to Tofu (ssh_public_key).
# Populated per milestone; addresses come from network/plan.json.
all:
  children:
    firewall: {}
    elastic:
      hosts:
        opaleye-elastic:
          ansible_host: 10.77.3.10
          ansible_user: opaleye
          ansible_become: true
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
    targets:
      hosts:
        t1:
          ansible_host: 10.77.11.10
          ansible_user: opaleye
          ansible_become: true
          # A rebuilt target has a new host key; scripts/target.sh clears the old one first.
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
    attacker:
      hosts:
        opaleye-attacker:
          ansible_host: 10.77.1.10
          ansible_user: opaleye
          ansible_become: true
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
    gateway:
      hosts:
        opaleye-gateway:
          ansible_host: 10.77.2.10
          ansible_user: opaleye
          ansible_become: true
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
    # #52: the analysis zone is reachable only through the gateway VM (the firewall lets nothing else open a connection in).
    analysis:
      hosts:
        remnux:
          ansible_host: 10.77.20.11
          ansible_user: opaleye
          ansible_become: true
          ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o ProxyJump=opaleye@10.77.2.10"
